<title>NASA Earth Information Center · Hyperwall</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden;

  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  video { max-width:100%; max-height:100%; width:auto; height:auto; display:block; }
  iframe { border:0; width:100%; height:100%; background:#000; }
  #frameWrap { position:fixed; inset:0; display:none; }

  #caption { position:fixed; left:0; right:0; bottom:0; padding:44px 52px 34px;
    /* Solid panel so bright text inside a visualization never bleeds through the
       caption. The whole caption still fades out (opacity) to reveal the art. */
    background:linear-gradient(to top, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0.97) 68%, rgba(0,0,0,0.82) 86%, rgba(0,0,0,0) 100%);
    transition:opacity .6s ease; }
  #caption.hidden { opacity:0; }
  #kicker { font-size:14px; letter-spacing:2.5px; text-transform:uppercase; color:#5fa8d3; margin-bottom:10px; font-weight:600; }
  #title { font-size:32px; font-weight:600; margin-bottom:10px; line-height:1.15; }
  #info { font-size:18px; font-weight:400; color:#c3cdd7; line-height:1.5; max-width:1100px; }
  #credit { font-size:13px; color:#788696; margin-top:14px; }

  #counter { position:fixed; top:26px; right:34px; color:#5f6b78; font-size:14px; letter-spacing:1px; }
  #brand { position:fixed; top:24px; left:34px; font-size:15px; letter-spacing:1px; color:#8b98a6; }
  #brand b { color:#dfe6ee; font-weight:600; }
  #loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#4a5560; font-size:16px; letter-spacing:3px; }
  #err { position:fixed; top:56px; left:34px; color:#9a6a6a; font-size:13px; max-width:44%; }
  #live { position:fixed; top:24px; left:50%; transform:translateX(-50%); font-size:13px; letter-spacing:2px;

  #live::before { content:"● "; color:#4caf50; }
  body.idle { cursor:none; }
  #help { position:fixed; bottom:14px; right:20px; font-size:12px; color:#4a5560; letter-spacing:.5px; }

  .emap-frame img { width:100%; height:100%; display:block; opacity:.92; }
  #eonetPts { position:absolute; inset:0; }

  .iss-frame { background:#02040a; overflow:hidden; box-shadow:0 0 120px rgba(0,0,0,.7) inset; }
  .iss-basemap { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:saturate(.7) brightness(.6) contrast(1.05); }
  .iss-layer { position:absolute; inset:0; width:100%; height:100%; }
  .iss-grid line { stroke:rgba(130,160,190,.10); stroke-width:.2; }
  .iss-night { fill:rgba(2,5,14,.58); stroke:rgba(120,170,255,.35); stroke-width:.25; }
  .iss-track-future { fill:none; stroke:#5fd0ff; stroke-width:.7; stroke-dasharray:2.4 2;
    filter:drop-shadow(0 0 2px rgba(95,208,255,.8)); }
  .iss-track-past { fill:none; stroke:#ffd166; stroke-width:.9;
    filter:drop-shadow(0 0 2px rgba(255,209,102,.7)); }
  .iss-dot { position:absolute; }
  .iss-marker { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:#fff;
    box-shadow:0 0 0 4px rgba(255,209,102,.30), 0 0 20px 7px rgba(255,209,102,.75); animation:isspulse 2s infinite; }
  .iss-label { position:absolute; left:11px; top:-8px; font-size:13px; font-weight:700; letter-spacing:1px;
    color:#ffe6a3; text-shadow:0 0 6px rgba(0,0,0,.9); }
  @keyframes isspulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.25);} }
  .iss-stats { position:fixed; top:96px; left:34px; font-size:19px; letter-spacing:1px; color:#eef3f8;
    background:rgba(4,10,20,.62); padding:14px 18px; border-radius:10px; line-height:1.55;
    font-variant-numeric:tabular-nums; min-width:236px; border:1px solid rgba(120,160,200,.18); }
  .iss-stats .s-row { display:flex; justify-content:space-between; gap:26px; }
  .iss-stats .s-row span { color:#8fa3b8; }
  .iss-legend { position:fixed; bottom:118px; left:34px; display:flex; gap:16px; font-size:14px; color:#c3cdd7; }
  .iss-legend .lg { display:flex; align-items:center; gap:8px; background:rgba(4,10,20,.55);
    padding:6px 12px; border-radius:20px; }
  .iss-legend .lg::before { content:""; width:16px; height:4px; border-radius:2px; }
  .iss-legend .lg-p::before { background:#ffd166; }
  .iss-legend .lg-f::before { background:#5fd0ff; }
  .iss-legend .lg-n::before { background:rgba(120,170,255,.5); }

    font-size:14px; color:#c3cdd7; }
  .eonet-legend span { background:rgba(0,0,0,.5); padding:5px 10px; border-radius:20px; }
  .apod-img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .cd-wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:64px; flex-wrap:wrap; }
  .cd-card { text-align:center; min-width:360px; }
  .cd-k { font-size:15px; letter-spacing:3px; text-transform:uppercase; color:#5fa8d3; margin-bottom:14px; }
  .cd-t { font-size:30px; font-weight:600; margin-bottom:6px; }
  .cd-when { font-size:16px; color:#8b98a6; margin-bottom:22px; }
  .cd-num { font-size:52px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:1px; color:#dfe6ee; }
  .ev-wrap { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 8%; }
  .ev-h { font-size:26px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#5fa8d3; margin-bottom:26px; }
  .ev-row { display:flex; align-items:baseline; gap:26px; padding:16px 0; border-top:1px solid rgba(255,255,255,.08); }
  .ev-when { width:200px; color:#8b98a6; font-size:18px; font-variant-numeric:tabular-nums; }
  .ev-name { flex:1; font-size:24px; font-weight:600; color:#eef3f8; }
  .ev-prov { color:#9aa7b4; font-size:16px; text-align:right; }

  /* ---- news dashboard slide ---- */
  .news-dash { position:absolute; inset:0; display:flex; gap:38px; padding:7% 6% 12%; }
  .news-hero { flex:1.35; display:flex; flex-direction:column; border-radius:14px; overflow:hidden;
    background:#0a0f16; border:1px solid rgba(120,160,200,.14); min-width:0; }
  .news-hero-img { flex:1; min-height:0; background:#0a0f16 center/cover no-repeat; }
  .news-hero-body { padding:26px 30px 28px; background:linear-gradient(to top, rgba(0,0,0,.92), rgba(6,12,22,.7)); }
  .news-hero-tag { font-size:13px; letter-spacing:2.5px; text-transform:uppercase; color:#ff9f43; font-weight:700; margin-bottom:12px; }
  .news-hero-title { font-size:34px; font-weight:700; line-height:1.14; color:#fff; }
  .news-hero-sum { font-size:17px; color:#c3cdd7; margin-top:14px; line-height:1.5; }
  .news-hero-meta { font-size:14px; color:#7ea6c8; margin-top:16px; letter-spacing:1.5px; text-transform:uppercase; }
  .news-list { flex:1; display:flex; flex-direction:column; min-width:0; }
  .news-list-h { font-size:15px; letter-spacing:2.5px; text-transform:uppercase; color:#5fa8d3; margin-bottom:8px; font-weight:600; }
  .news-item { display:flex; gap:16px; padding:15px 0; border-top:1px solid rgba(255,255,255,.09); align-items:center; }
  .news-item-thumb { width:108px; height:64px; flex:none; border-radius:6px; background:#0a0f16 center/cover no-repeat; }
  .news-item-body { flex:1; min-width:0; }
  .news-item-title { font-size:19px; font-weight:600; color:#eef3f8; line-height:1.26; }
  .news-item-meta { font-size:13px; color:#8b98a6; margin-top:5px; letter-spacing:.5px; }

  /* ---- crossfade between items ---- */
  #stage, #frameWrap, #panel { transition:opacity .6s ease; }
  body.fade-out #stage, body.fade-out #frameWrap, body.fade-out #panel { opacity:0 !important; }
</style>

const errEl = document.getElementById('err');
const liveEl = document.getElementById('live');
const panel = document.getElementById('panel');

let idx = 0, frameTimer = null, frameStuck = null, frameOk = false;
let videoStuck = null, consecutiveFails = 0, focusGuard = null;
let liveActive = false, liveRecheck = null, livePoll = null, suppressLiveUntil = 0;
let panelTimer = null, issInterval = null, tickInterval = null, curType = null;
let launchCache = { t:0, data:null };
let apodCache = { t:0, data:null };
let gen = 0;   // bumped on every show(); async panels bail if it changes mid-fetch

// Clear every timer/interval any surface might have running before switching.
function clearAllTimers(){
  clearTimeout(frameTimer); clearTimeout(frameStuck); clearTimeout(videoStuck);
  clearTimeout(panelTimer); clearInterval(focusGuard);
  clearInterval(issInterval); clearInterval(tickInterval);
}

// Central skip-on-failure: log to the console (visible in the terminal/devtools),
// show a brief on-screen note, and advance so a bad fetch never freezes the wall.
// If every item fails in a row (e.g. the network is fully down), stop hammering
// and retry the whole loop after a short pause instead of spinning.
function fail(reason){
  clearAllTimers();
  const t = (ITEMS[idx] && ITEMS[idx].title) || "item " + idx;
  console.error("[hyperwall] " + reason + ": skipping \u201c" + t + "\u201d");
  errEl.textContent = reason + " (skipping).";
  consecutiveFails++;
  if (consecutiveFails >= ITEMS.length){
    console.error("[hyperwall] all " + ITEMS.length + " items failed in a row, pausing 15s before retrying.");
    errEl.textContent = "No data reachable, retrying shortly\u2026";
    setTimeout(()=>{ consecutiveFails = 0; next(); }, 15000);
    return;
  }
  next();
}

function setCaption(it){
  kickerEl.textContent = it.kicker || "";
  titleEl.textContent = it.title || "";
  infoEl.textContent = it.info || "";
  counter.textContent = (idx+1) + " / " + ITEMS.length;
}

function showCaptionTemporarily(ms){
  cap.classList.remove('hidden');
  clearTimeout(window._capT);
  window._capT = setTimeout(()=>cap.classList.add('hidden'), ms || 9000);
}

function show(i){
  idx = i;
  gen++;
  clearAllTimers();
  const it = ITEMS[i];
  curType = it.type;
  // Reset every surface, stop stray audio, and clear the previous iframe.
  stage.style.display = 'none';
  frameWrap.style.display = 'none';
  panel.style.display = 'none';
  panel.innerHTML = '';
  try { v.pause(); } catch(e){}
  if (it.type !== 'frame') frame.src = 'about:blank';
  loader.style.display = 'none';
  liveEl.style.display = 'none';
  errEl.textContent = '';
  setCaption(it);
  document.getElementById('credit').textContent = "NASA's Scientific Visualization Studio · Public Domain";

  switch (it.type){
    case 'video':     return showVideo(it);
    case 'frame':     return showFrame(it);
    case 'iss':       return showISS(it);
    case 'apod':      return showAPOD(it);
    case 'events':    return showEvents(it);
    case 'news':      return showNews(it);
    default:          return showVideo(it);
  }
}

function showVideo(it){
  stage.style.display = 'flex';
  // Daily-updated files: append a cache-buster so the TV always pulls
  // today's version instead of a stale cached copy. Timeless films load plain.
  liveEl.style.display = it.daily ? 'block' : 'none';
  v.src = it.daily ? (it.url + "?t=" + Date.now()) : it.url;
  v.load();
  const p = v.play(); if (p) p.catch(()=>{});
  showCaptionTemporarily(9000);
  // Watchdog: if a video neither loads nor fires 'error' (e.g. a mid-run
  // network drop that just hangs the request) skip it so the wall never stalls.
  videoStuck = setTimeout(()=>{ if (v.readyState < 2) fail("Timed out fetching: " + it.title); }, 15000);
}

function showFrame(it){
  frameWrap.style.display = 'block';
  liveEl.style.display = 'block';
  frameOk = false;
  frame.src = it.url;
  showCaptionTemporarily(11000);
  // If a live app refuses to be embedded (X-Frame-Options / CSP frame-ancestors)
  // the iframe never fires 'load' and would sit black forever, so bail to the next.
  frameStuck = setTimeout(()=>{ if (!frameOk) fail("Live panel blocked embedding: " + it.title); }, 8000);
  // Keep keyboard focus on the page so the arrow keys always work; mouse is unaffected.
  frame.blur(); window.focus();
  focusGuard = setInterval(()=>{ if (document.activeElement === frame){ frame.blur(); window.focus(); } }, 350);
  // Interactive panels never "end": advance after the dwell of no interaction (wake() resets it).
  frameTimer = setTimeout(next, (it.dwell ? it.dwell*1000 : IDLE_ADVANCE_MS));
}

// Live ISS tracker: SGP4 orbit propagation + day/night terminator ------------
// Equirectangular map coords: x = lon+180 (0..360), y = 90-lat (0..180).
function lonToPct(lon){ return (lon + 180) / 360 * 100; }
function latToPct(lat){ return (90 - lat) / 180 * 100; }

function issGrid(){
  let s = '';
  for (let lon = 30; lon < 360; lon += 30) s += '<line x1="'+lon+'" y1="0" x2="'+lon+'" y2="180"/>';
  for (let lat = 30; lat < 180; lat += 30) s += '<line x1="0" y1="'+lat+'" x2="360" y2="'+lat+'"/>';
  return s;
}

// Build an SVG path from lon/lat points, lifting the pen at the ±180° seam.
function issTrack(points){
  let d = '', prev = null;
  for (const p of points){
    const x = p.lon + 180, y = 90 - p.lat;
    if (prev === null || Math.abs(x - prev) > 180) d += ' M' + x.toFixed(2) + ' ' + y.toFixed(2);
    else d += ' L' + x.toFixed(2) + ' ' + y.toFixed(2);
    prev = x;
  }
  return d.trim();
}

// Subsolar point (declination + longitude) for the day/night terminator.
function subsolar(date){
  const rad = Math.PI/180;
  const n = date.getTime()/86400000 + 2440587.5 - 2451545.0;   // days since J2000
  const L = (280.460 + 0.9856474*n) % 360;
  const g = ((357.528 + 0.9856003*n) % 360) * rad;
  const lambda = (L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * rad;
  const eps = (23.439 - 0.0000004*n) * rad;
  const dec = Math.asin(Math.sin(eps)*Math.sin(lambda));
  const ra  = Math.atan2(Math.cos(eps)*Math.sin(lambda), Math.cos(lambda));
  let subLon = (ra - satellite.gstime(date)) / rad;
  subLon = ((subLon + 180) % 360 + 360) % 360 - 180;
  return { dec, subLon };
}

function terminatorPath(date){
  const { dec, subLon } = subsolar(date);
  const rad = Math.PI/180;
  let d = '';
  for (let lon = -180; lon <= 180; lon += 2){
    const H = (lon - subLon) * rad;
    const lat = Math.atan(-Math.cos(H)/Math.tan(dec)) / rad;
    d += (lon === -180 ? 'M' : 'L') + (lon+180).toFixed(2) + ' ' + (90-lat).toFixed(2) + ' ';
  }
  return d + (dec >= 0 ? 'L360 180 L0 180 Z' : 'L360 0 L0 0 Z');   // close over the dark hemisphere
}

// Latest ISS orbital elements; falls back to a second source.
async function fetchISSTLE(){
  try {
    const r = await fetch('https://tle.ivanstanojevic.me/api/tle/25544');
    if (r.ok){ const j = await r.json(); if (j.line1 && j.line2) return [j.line1, j.line2]; }
  } catch(e){ /* try the fallback */ }
  const r2 = await fetch('https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE');
  const lines = (await r2.text()).trim().split(/\r?\n/);
  return [lines[1], lines[2]];
}

async function showISS(it){
  const g = gen;
  panel.style.display = 'block';
  liveEl.style.display = 'block';
  panel.innerHTML =
      '<div class="emap"><div class="emap-frame iss-frame">'
    +   '<img class="iss-basemap" src="' + ISS_BASEMAP + '" alt="" onerror="this.style.display=&#39;none&#39;">'
    +   '<svg class="iss-layer" viewBox="0 0 360 180" preserveAspectRatio="none"><path id="issNight" class="iss-night"/></svg>'
    +   '<svg class="iss-layer iss-grid" viewBox="0 0 360 180" preserveAspectRatio="none">' + issGrid() + '</svg>'
    +   '<svg class="iss-layer" viewBox="0 0 360 180" preserveAspectRatio="none" style="overflow:visible">'
    +     '<path id="issFuture" class="iss-track-future"/><path id="issPast" class="iss-track-past"/></svg>'
    +   '<div class="iss-dot" id="issDot" style="display:none"><span class="iss-marker"></span><span class="iss-label">ISS</span></div>'
    + '</div></div>'
    + '<div class="iss-stats" id="issStats">Acquiring orbit…</div>'
    + '<div class="iss-legend"><span class="lg lg-p">Ground track</span>'
    +   '<span class="lg lg-f">Predicted orbit</span><span class="lg lg-n">Night side</span></div>';
  showCaptionTemporarily(11000);
  reveal();

  const dot   = document.getElementById('issDot');
  const stats = document.getElementById('issStats');
  const night = document.getElementById('issNight');
  const fut   = document.getElementById('issFuture');
  const past  = document.getElementById('issPast');

  let satrec = null;
  try {
    const [l1, l2] = await fetchISSTLE();
    if (g !== gen) return;
    satrec = satellite.twoline2satrec(l1, l2);
  } catch(e){ /* no TLE, so fall back to a live-position dot with no prediction */ }

  function propAt(date){
    const pv = satellite.propagate(satrec, date);
    if (!pv || !pv.position) return null;
    const geo = satellite.eciToGeodetic(pv.position, satellite.gstime(date));
    return { lon:satellite.degreesLong(geo.longitude), lat:satellite.degreesLat(geo.latitude),
             alt:geo.height, vel:pv.velocity };
  }

  function drawTracks(){
    if (!satrec) return;
    const now = Date.now(), p = [], f = [];
    for (let m = -50; m <= 0; m++){ const q = propAt(new Date(now + m*60000)); if (q) p.push(q); }
    for (let m = 0;  m <= 96; m++){ const q = propAt(new Date(now + m*60000)); if (q) f.push(q); }
    past.setAttribute('d', issTrack(p));
    fut.setAttribute('d', issTrack(f));
  }

  function drawNight(){ if (satrec) night.setAttribute('d', terminatorPath(new Date())); }

  async function updDot(){
    let lon, lat, alt, spd;
    if (satrec){
      const q = propAt(new Date());
      if (!q) return;
      lon = q.lon; lat = q.lat; alt = q.alt;
      spd = Math.hypot(q.vel.x, q.vel.y, q.vel.z) * 3600;   // km/s -> km/h
    } else {
      try {
        const r = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
        if (!r.ok) return; const d = await r.json(); if (g !== gen) return;
        lon = d.longitude; lat = d.latitude; alt = d.altitude; spd = d.velocity;
      } catch(e){ return; }
    }
    dot.style.left = lonToPct(lon) + '%';
    dot.style.top  = latToPct(lat) + '%';
    dot.style.display = 'block';
    const period = satrec ? (2*Math.PI/satrec.no) : 92.7;   // minutes
    stats.innerHTML =
        '<div class="s-row"><span>LAT</span><b>'   + lat.toFixed(2) + '\u00b0</b></div>'
      + '<div class="s-row"><span>LON</span><b>'   + lon.toFixed(2) + '\u00b0</b></div>'
      + '<div class="s-row"><span>ALT</span><b>'   + Math.round(alt) + ' km</b></div>'
      + '<div class="s-row"><span>SPEED</span><b>' + Math.round(spd).toLocaleString() + ' km/h</b></div>'
      + '<div class="s-row"><span>PERIOD</span><b>'+ period.toFixed(1) + ' min</b></div>';
    errEl.textContent = ''; consecutiveFails = 0;
  }

  drawNight(); drawTracks(); updDot();
  let ticks = 0;
  issInterval = setInterval(()=>{
    if (g !== gen) return;
    updDot();
    if (++ticks % 30 === 0){ drawTracks(); drawNight(); }   // refresh path + terminator ~every 60s
  }, 2000);
  panelTimer = setTimeout(next, (it.dwell ? it.dwell*1000 : 45000));
}

// Astronomy Picture of the Day ------------------------------------------------
// Try NASA's official API first; when the shared DEMO_KEY is rate-limited
// (HTTP 429/503) fall back to a keyless, CORS-friendly APOD mirror so the
// panel still shows today's image instead of failing.
// Fetch JSON with a hard timeout so a hanging endpoint can't stall the slide.
async function fetchJSON(url, ms){
  const c = new AbortController();
  const t = setTimeout(()=>c.abort(), ms);
  try {
    const r = await fetch(url, { signal:c.signal });
    if (!r.ok) throw new Error(url + ' ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

async function getAPOD(){
  // Serve the launch-time cache (valid for the day) so the slide is instant.
  if (apodCache.data && (Date.now() - apodCache.t) < 6*60*60*1000) return apodCache.data;
  const nasa   = ()=> fetchJSON('https://api.nasa.gov/planetary/apod?thumbs=true&api_key=' + NASA_API_KEY, 4500);
  const mirror = ()=> fetchJSON('https://apod.ellanan.com/api', 6000);
  // DEMO_KEY is heavily rate-limited (503) and can hang for many seconds; when
  // no real key is set, hit the keyless mirror first so APOD loads promptly.
  const order = NASA_API_KEY === 'DEMO_KEY' ? [mirror, nasa] : [nasa, mirror];
  let lastErr;
  for (const f of order){ try { const d = await f(); apodCache = { t:Date.now(), data:d }; return d; } catch(e){ lastErr = e; } }
  throw lastErr || new Error('apod failed');
}

// Fetch APOD and warm the browser's image cache at launch so there is no wait
// by the time the slide comes around.
function preloadAPOD(){
  getAPOD().then(d => {
    const src = d && (d.hdurl || d.url);
    if (src && d.media_type !== 'video'){ const im = new Image(); im.src = src; }
  }).catch(()=>{});
}

async function showAPOD(it){
  const g = gen;
  panel.style.display = 'block';
  showCaptionTemporarily(14000);
  try {
    const d = await getAPOD();
    if (g !== gen) return;
    kickerEl.textContent = 'Astronomy Picture of the Day \u00b7 ' + (d.date || '');
    titleEl.textContent  = d.title || 'Astronomy Picture of the Day';
    const exp = d.explanation || '';
    infoEl.textContent = exp.length > 600 ? exp.slice(0, 600) + '\u2026' : exp;
    document.getElementById('credit').textContent = d.copyright ? ('\u00a9 ' + d.copyright.trim()) : 'NASA \u00b7 Public Domain';
    if (d.media_type !== 'video'){
      const src = d.hdurl || d.url;
      // Real <img> so the picture paints progressively and gives a load event to
      // fade in on, instead of blocking on a multi-MB hi-res background download.
      panel.innerHTML = '<img class="apod-img" alt="">';
      const el = panel.querySelector('.apod-img');
      el.onload = ()=>{ if (g === gen) reveal(); };
      el.onerror = ()=>{ if (g === gen && d.url && el.src !== d.url) el.src = d.url; else reveal(); };
      el.src = src;
    } else {
      // APOD video: hand off to the iframe
      panel.style.display = 'none';
      frameWrap.style.display = 'block';
      frameOk = false;
      frame.src = d.url;
      frameStuck = setTimeout(()=>{ if (!frameOk) fail("APOD video blocked embedding"); }, 8000);
      frame.blur(); window.focus();
      focusGuard = setInterval(()=>{ if (document.activeElement === frame){ frame.blur(); window.focus(); } }, 350);
    }
    errEl.textContent = ''; consecutiveFails = 0;
  } catch(e){ if (g !== gen) return; return fail("Couldn't load APOD"); }
  if (g !== gen) return;
  panelTimer = setTimeout(next, (it.dwell ? it.dwell*1000 : 30000));
}

// Shared upcoming-launch fetch (cached ~20 min to respect API rate limits) -----
async function getLaunches(){
  if (launchCache.data && (Date.now() - launchCache.t) < 20*60*1000) return launchCache.data;
  const r = await fetch('https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=8');
  if (!r.ok) throw new Error('launch fetch ' + r.status);
  const d = await r.json();
  launchCache = { t: Date.now(), data: d.results || [] };
  return launchCache.data;
}

// Upcoming launch schedule ----------------------------------------------------
async function showEvents(it){
  const g = gen;
  panel.style.display = 'block';
  showCaptionTemporarily(12000);
  let ls;
  try { ls = await getLaunches(); } catch(e){ if (g !== gen) return; return fail("Couldn't load launch schedule"); }
  if (g !== gen) return;
  if (!ls || !ls.length) return fail("No upcoming launches");
  const rows = ls.slice(0, 6).map(l => {
    const dt = l.net ? new Date(l.net) : null;
    const when = dt ? dt.toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : 'TBD';
    const prov = (l.launch_service_provider && l.launch_service_provider.name) || '';
    return '<div class="ev-row"><div class="ev-when">' + when + '</div>'
      + '<div class="ev-name">' + (l.name || '') + '</div>'
      + '<div class="ev-prov">' + prov + '</div></div>';
  }).join('');
  panel.innerHTML = '<div class="ev-wrap"><div class="ev-h">Upcoming Launches</div>' + rows + '</div>';
  reveal();
  errEl.textContent = ''; consecutiveFails = 0;
  panelTimer = setTimeout(next, (it.dwell ? it.dwell*1000 : 32000));
}

// Escape untrusted remote text before inserting it as HTML.
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

// Live news dashboard ---------------------------------------------------------
// Spaceflight News API v4 is keyless and CORS-friendly. Pulling the latest
// across all major space/science newsrooms (rather than a single site) surfaces
// the biggest current stories. Rendered as a hero lead + a headline list.
async function showNews(it){
  const g = gen;
  panel.style.display = 'block';
  showCaptionTemporarily(12000);
  let arts;
  try {
    const r = await fetch('https://api.spaceflightnewsapi.net/v4/articles/?limit=7&ordering=-published_at');
    if (!r.ok) throw new Error('news ' + r.status);
    arts = (await r.json()).results || [];
  } catch(e){ if (g !== gen) return; return fail("Couldn't load news"); }
  if (g !== gen) return;
  if (!arts.length) return fail("No news available");

  const fmt = (iso) => { const d = iso ? new Date(iso) : null;
    return d && !isNaN(d) ? d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) : ''; };
  // Sanitize the image URL so it can't break out of the CSS url('...') context.
  const safeImg = (u) => u ? String(u).replace(/['"()\\\s]/g, '') : '';
  const meta = (a) => escapeHtml(a.news_site || '') + (fmt(a.published_at) ? ' \u00b7 ' + fmt(a.published_at) : '');

  const lead = arts[0];
  const leadImg = safeImg(lead.image_url);
  const leadSum = (lead.summary || '').trim();
  const hero =
      '<div class="news-hero">'
    +   '<div class="news-hero-img"' + (leadImg ? ' style="background-image:url(&#39;'+leadImg+'&#39;)"' : '') + '></div>'
    +   '<div class="news-hero-body">'
    +     '<div class="news-hero-tag">Top Story</div>'
    +     '<div class="news-hero-title">' + escapeHtml(lead.title || '') + '</div>'
    +     (leadSum ? '<div class="news-hero-sum">' + escapeHtml(leadSum.length > 220 ? leadSum.slice(0,220)+'\u2026' : leadSum) + '</div>' : '')
    +     '<div class="news-hero-meta">' + meta(lead) + '</div>'
    +   '</div>'
    + '</div>';

  const items = arts.slice(1, 6).map(a => {
    const img = safeImg(a.image_url);
    const thumb = '<div class="news-item-thumb"' + (img ? ' style="background-image:url(&#39;'+img+'&#39;)"' : '') + '></div>';
    return '<div class="news-item">' + thumb
      + '<div class="news-item-body"><div class="news-item-title">' + escapeHtml(a.title || '') + '</div>'
      + '<div class="news-item-meta">' + meta(a) + '</div></div></div>';
  }).join('');

  panel.innerHTML = '<div class="news-dash">' + hero
    + '<div class="news-list"><div class="news-list-h">More Headlines</div>' + items + '</div></div>';
  document.getElementById('credit').textContent = 'Source: Spaceflight News API';
  reveal();
  errEl.textContent = ''; consecutiveFails = 0;
  panelTimer = setTimeout(next, (it.dwell ? it.dwell*1000 : 30000));
}

v.addEventListener('loadeddata', ()=>{
  clearTimeout(videoStuck);
  loader.style.display='none'; errEl.textContent=''; consecutiveFails=0;
  reveal();
  showCaptionTemporarily(9000);
});
v.addEventListener('ended', next);
v.addEventListener('error', ()=>{ fail("Couldn't load: " + ITEMS[idx].title); });

// A live iframe reported a successful load, so cancel the embed-block fallback.
frame.addEventListener('load', ()=>{ frameOk = true; clearTimeout(frameStuck); errEl.textContent=''; consecutiveFails=0; reveal(); try{ window.focus(); }catch(e){} });

// ---- NASA live-stream detection & auto-switch ----------------------------
// Ask the YouTube Data API whether any configured NASA channel is broadcasting
// live right now. Returns the live video's id/title, or null.
async function fetchNasaLive(){
  if (!YT_API_KEY) return null;
  for (const id of NASA_CHANNELS){
    try {
      const u = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video"
              + "&eventType=live&channelId=" + id + "&key=" + YT_API_KEY;
      const r = await fetch(u);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.items && j.items.length){
        const it = j.items[0];
        return { videoId: it.id.videoId, title: it.snippet.title, channel: it.snippet.channelTitle };
      }
    } catch(e){ /* network hiccup, ignore this channel and try the next */ }
  }
  return null;
}

// Take over the wall with the NASA live broadcast.
function showLive(live){
  liveActive = true;
  clearAllTimers();
  try { v.pause(); }catch(e){}
  v.removeAttribute('src'); v.load();
  stage.style.display = 'none';
  loader.style.display = 'none';
  frameWrap.style.display = 'block';
  liveEl.style.display = 'block';
  kickerEl.textContent = "LIVE NOW · " + (live.channel || "NASA");
  titleEl.textContent  = live.title || "NASA Live";
  infoEl.textContent   = "NASA is broadcasting live. The wall switched to the stream automatically and will return to the visualization loop when the broadcast ends. Press \u2192 to dismiss.";
  counter.textContent  = "";
  frame.src = "https://www.youtube.com/embed/" + live.videoId + "?autoplay=1&mute=1&playsinline=1";
  showCaptionTemporarily(12000);
  // Keep keyboard focus on the page so \u2192 can dismiss the stream.
  frame.blur(); window.focus();
  focusGuard = setInterval(()=>{ if (document.activeElement === frame){ frame.blur(); window.focus(); } }, 350);
  // Confirm the broadcast is still live; when it ends, resume the loop.
  clearInterval(liveRecheck);
  liveRecheck = setInterval(async ()=>{ if (!(await fetchNasaLive())) endLive(); }, LIVE_RECHECK_MS);
}

// Broadcast ended (or dismissed): drop the stream and resume normal rotation.
function endLive(){
  liveActive = false;
  clearInterval(liveRecheck); clearInterval(focusGuard);
  frame.src = "about:blank";
  next();
}

// User manually skipped the live stream: don't auto-switch back for a while.
function dismissLive(){ suppressLiveUntil = Date.now() + LIVE_COOLDOWN_MS; endLive(); }

// Periodic poll: switch to the stream the moment NASA goes live.
async function pollLive(){
  if (liveActive || Date.now() < suppressLiveUntil) return;
  const live = await fetchNasaLive();
  if (live && !liveActive) showLive(live);
}

// Load API keys from a .env file served next to this page (KEY=VALUE lines).
// Requires being served over http(s); when opened via file:// the fetch fails
// and the inline defaults above are used instead.
async function loadEnv(){
  try {
    const r = await fetch('.env', { cache:'no-store' });
    if (!r.ok) return;
    (await r.text()).split(/\r?\n/).forEach(line=>{
      line = line.trim();
      if (!line || line[0] === '#') return;
      const eq = line.indexOf('=');
      if (eq < 0) return;
      const key = line.slice(0, eq).trim();
      const val = line.slice(eq + 1).trim().replace(/^["']|["']$/g, '');
      if (key === 'YT_API_KEY') YT_API_KEY = val;
      else if (key === 'NASA_API_KEY' && val) NASA_API_KEY = val;
    });
  } catch(e){ /* no .env (or opened via file://), so use inline defaults */ }
}

// Crossfade helper: fade the current surface out, swap in the next one while it
// is still invisible, then fade it in only once its content is actually ready
// (video first frame, iframe load, or fetched panel HTML). A safety timeout
// reveals the slide anyway so a slow feed can never leave the wall blank.
const FADE_MS = 600;
let fading = false, revealFallback = null;
function go(i){
  if (liveActive) return;
  if (fading){ show(i); return; }   // mid-fade rapid skip: swap immediately
  fading = true;
  document.body.classList.add('fade-out');
  setTimeout(()=>{
    show(i);
    clearTimeout(revealFallback);
    revealFallback = setTimeout(reveal, 4000);
  }, FADE_MS);
}

// Fade the freshly prepared slide in. Each surface calls this once its content
// is ready; the double rAF lets the browser paint it at opacity 0 first.
function reveal(){
  clearTimeout(revealFallback);
  if (!fading) return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.body.classList.remove('fade-out');
    fading = false;
  }));
}

function next(){ if (liveActive) return; go((idx+1) % ITEMS.length); }
function prev(){ if (liveActive) return; go((idx-1+ITEMS.length) % ITEMS.length); }

const IDLE_ADVANCE_MS = 30000;
let idleT;
function wake(){
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(()=>document.body.classList.add('idle'), 4000);
  // On live interactive panels, restart the "no interaction" countdown instead
  // of popping the caption back up, so you can keep clicking around.
  if (curType === 'frame'){
    clearTimeout(frameTimer);
    frameTimer = setTimeout(next, IDLE_ADVANCE_MS);
  }
}
document.addEventListener('mousemove', wake);
document.addEventListener('touchstart', wake);
document.addEventListener('click', (e)=>{
  // don't hijack clicks meant for a live iframe, just reset its idle countdown
  if (frameWrap.style.display === 'block'){ wake(); return; }
  next();
});
document.addEventListener('keydown', (e)=>{
  if (e.key==='ArrowRight'){ if (liveActive) dismissLive(); else next(); }
  else if (e.key==='ArrowLeft'){ if (liveActive) dismissLive(); else prev(); }
  else if (e.key==='ArrowUp'){ clearTimeout(window._capT); cap.classList.remove('hidden'); }
  else if (e.key==='ArrowDown'){ clearTimeout(window._capT); cap.classList.add('hidden'); }
  else if (e.key==='f'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

show(0);

// Load .env keys, then warm APOD and start NASA live-stream detection.
loadEnv().then(()=>{
  preloadAPOD();
  if (YT_API_KEY){
    pollLive();
    livePoll = setInterval(pollLive, LIVE_POLL_MS);
  }
});
</script>
